f" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">Faces the weather</text><polyline points="780.3,326.0 808.0,155.0" fill="none" stroke="#a3a3a5" stroke-width="1" stroke-dasharray="3 3"/><circle cx="780.3" cy="326.0" r="3" fill="#a3a3a5"/><text x="820.0" y="160.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#222224" text-anchor="start">Inner aluminum shell</text><text x="820.0" y="182.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">Stays close to room temperature</text><polyline points="524.0,470.0 270.0,555.0" fill="none" stroke="#a3a3a5" stroke-width="1" stroke-dasharray="3 3"/><circle cx="524.0" cy="470.0" r="3" fill="#a3a3a5"/><text x="40.0" y="560.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#222224" text-anchor="start">Polyamide strips</text><text x="40.0" y="582.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">Glass-fibre reinforced, rolled and crimped</text><polyline points="544.8,414.0 270.0,355.0" fill="none" stroke="#a3a3a5" stroke-width="1" stroke-dasharray="3 3"/><circle cx="544.8" cy="414.0" r="3" fill="#a3a3a5"/><text x="40.0" y="360.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#222224" text-anchor="start">Insulating core</text><text x="40.0" y="382.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">Foam in high-performance systems</text><text x="40.0" y="650.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">No solid metal path from outside to inside: heat has to cross the insulating break.</text></svg>
