-anchor="start">Where a window loses heat</text><text x="40.0" y="80.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6f6f72" text-anchor="start">Heat escapes through the frame and glass edge, not just the pane</text><polyline points="513.3,268.5 748.0,245.0" fill="none" stroke="#a3a3a5" stroke-width="1" stroke-dasharray="3 3"/><circle cx="513.3" cy="268.5" r="3" fill="#a3a3a5"/><text x="760.0" y="250.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#222224" text-anchor="start">Frame</text><text x="760.0" y="272.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">Profile material, chambers, thermal break</text><polyline points="499.8,331.8 748.0,340.0" fill="none" stroke="#a3a3a5" stroke-width="1" stroke-dasharray="3 3"/><circle cx="499.8" cy="331.8" r="3" fill="#a3a3a5"/><text x="760.0" y="345.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#222224" text-anchor="start">Center of glass (Ug)</text><text x="760.0" y="367.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">Panes, low-E coating, gas fill</text><polyline points="545.6,450.2 748.0,435.0" fill="none" stroke="#a3a3a5" stroke-width="1" stroke-dasharray="3 3"/><circle cx="545.6" cy="450.2" r="3" fill="#a3a3a5"/><text x="760.0" y="440.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#222224" text-anchor="start">Glass edge and spacer</text><text x="760.0" y="462.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">Warm-edge spacers cut this loss</text><rect x="756" y="514" width="330" height="96" rx="8" fill="#ffffff" stroke="#1f4e8c" stroke-width="1.2"/><text x="774.0" y="540.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f4e8c" text-anchor="start">Whole-window U-factor</text><text x="774.0" y="562.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">NFRC rating in the US, Uw in Europe.</text><text x="774.0" y="582.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">Counts all three. Compare quotes on this.</text><line x1="40" y1="730" x2="76" y2="730" stroke="#c8553d" stroke-width="5" stroke-linecap="round"/><text x="86.0" y="735.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">More heat loss</text><line x1="230" y1="730" x2="266" y2="730" stroke="#e9a23b" stroke-width="3.5" stroke-linecap="round"/><text x="276.0" y="735.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">Medium</text><line x1="420" y1="730" x2="456" y2="730" stroke="#f2c879" stroke-width="2.5" stroke-linecap="round"/><text x="466.0" y="735.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6f6f72" text-anchor="start">Less</text></svg>
