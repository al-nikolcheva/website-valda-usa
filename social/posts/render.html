<!doctype html><html lang="en"><head><meta charset="utf-8"><title>VALDA post</title>
<link rel="stylesheet" href="layout.css"></head><body>
<script src="posts.js"></script>
<script>
const q=new URLSearchParams(location.search), N=+q.get('n'), SQ=q.get('fmt')==='sq';
if(SQ) document.body.classList.add('sq');
const post=window.POSTS.find(p=>p.n===N), total=post.slides.length;
const W=`<img class="sym" src="${P}valda-logo-white.svg">`, K=`<img class="sym" src="${P}valda-logo-ink.svg">`;
const ph=s=>s.replace(/\[([^\]]+)\]/g,'<span class="todo">[$1]</span>');
const nn=i=>total>1?`/${String(i+1).padStart(2,'0')}`:'';
const arrow=c=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>`;
const sw=(s)=>s.single?'':'<span>Swipe →</span>';
const bg=(img,pos='50% 50%',shade='linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 25%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6))')=>`<img class="bgimg" src="${img}" style="object-position:${pos}"><div class="shade" style="background:${shade}"></div>`;
const T={
 photo:(s,i)=>`<section class="slide onphoto">${bg(s.img,s.pos,'linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 72%,rgba(0,0,0,.45))')}<div class="hd"><span class="mi">${nn(i)}</span>${W}</div><div class="body end cv-photo"><div class="lab"><b>${s.h}</b>${s.d}</div></div></section>`,
 photoType:(s,i)=>`<section class="slide onphoto">${bg(s.img,s.pos,'linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.05) 30%,rgba(0,0,0,.2) 55%,rgba(0,0,0,.72))')}<div class="hd"><span class="mi">Project ${nn(i)}</span>${W}</div><div class="body end"><h1 class="h1">${s.h}</h1><div class="meta rule mt">${'<span>'+s.d+'</span><span>'+s.c+'</span>'}</div></div></section>`,
 card:(s,i)=>`<section class="slide"><div class="hd"><span class="mi">Project ${nn(i)}</span>${K}</div><div class="body" style="margin-top:28px"><div class="grow ph"><img src="${s.img}"></div><h1 class="h2 mt">${s.h}</h1><div class="cards mt2" style="grid-template-columns:repeat(3,1fr)">${s.meta.map(([k,v])=>`<div class="card" style="padding:18px 22px"><span class="k">${k}</span><span class="v" style="font-size:26px">${v}</span></div>`).join('')}</div></div></section>`,
 sand:(s,i)=>`<section class="slide sandbg"><div class="hd"><span class="mi">What we have ${nn(i)}</span>${K}</div><div class="body"><h1 class="h1">${s.h}</h1><p class="lead" style="max-width:440px">${s.d}</p><div class="grow"><img class="cut" src="${s.img}"></div><div class="strip rule"><span>System</span>${s.c}</div></div></section>`,
 darkCut:(s,i)=>`<section class="slide dark"><div class="hd"><span class="mi">What we have ${nn(i)}</span>${W}</div><div class="body"><h1 class="h1" style="font-size:calc(96px*var(--k))">${s.h}</h1><div class="grow center mt"><img src="${s.img}"></div><div class="strip rule"><span>System</span>${s.c}</div></div></section>`,
 inSitu:(s,i)=>`<section class="slide onphoto">${bg(s.img,s.pos,'linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,0) 25%)')}<div class="hd"><span class="mi">What we have ${nn(i)}</span>${W}</div><div class="body end"><div class="tag"><b>${s.h}</b><span>${s.c}</span></div></div></section>`,
 charQ:(s,i)=>`<section class="slide dark"><div class="hd">${W}<span class="mi">${s.c}</span></div><div class="body"><h1 class="h1">${s.h}</h1><div class="cta mt2" style="align-items:flex-start"><p class="lead" style="margin:0;max-width:520px;font-weight:400;font-size:calc(26px*var(--k))">${s.d}</p><span class="mi blue" style="color:var(--blue-l)">${s.single?'':'Swipe →'}</span></div><div class="grow ph mt"><img src="${s.img}"></div></div></section>`,
 stat:(s,i)=>`<section class="slide panelbg"><div class="hd">${K}<span class="mi">${s.c}</span></div><div class="body" style="justify-content:center"><div class="num">${s.n}</div><h1 class="h2 mt">${s.h}</h1><p class="lead" style="max-width:600px">${s.d}</p></div><div class="strip rule" style="font-size:19px;font-weight:400;color:var(--mute)"><span>${s.f}</span>${sw(s)}</div></section>`,
 over:(s,i)=>`<section class="slide onphoto">${bg(s.img,s.pos,'linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.08) 35%,rgba(0,0,0,.2) 55%,rgba(0,0,0,.78))')}<div class="hd">${W}<span class="mi">${s.c}</span></div><div class="body end"><h1 class="h1">${s.h}</h1><p class="lead">${s.d}</p></div></section>`,
 drawing:(s,i)=>`<section class="slide"><div class="hd">${K}<span class="mi">${s.c}</span></div><div class="body"><h1 class="h1">${s.h}</h1><div class="grow drawing mt"><p>${s.d}</p><div><img src="${s.img}"></div></div><div class="strip rule" style="font-size:19px;font-weight:400;color:var(--mute)"><span>${s.f}</span><span>Swipe →</span></div></div></section>`,
 // inside slides
 compare:(s,i)=>`<section class="slide"><div class="hd">${K}<span class="mi">${nn(i)}</span></div><div class="body"><div class="label">${s.label}</div><h2 class="h2">${s.h}</h2><p class="lead">${s.lead}</p><div class="grow cards mt">${[s.a,s.b].map(x=>`<div class="card" style="padding:12px 12px 26px"><div class="ph" style="flex:1;position:relative;min-height:0"><img src="${x.img}" style="position:absolute;inset:0"><span class="chip" style="position:absolute;left:14px;top:14px"><span class="dot"></span>${x.k}</span></div><span class="v ${x.blue?'blue':''}" style="padding:0 16px">${x.v}</span></div>`).join('')}</div></div></section>`,
 split:(s,i)=>`<section class="slide"><div class="hd">${K}<span class="mi">${nn(i)}</span></div><div class="body split" style="margin-top:40px;${s.flip?'flex-direction:row-reverse':''}"><div class="ph" style="position:relative"><img src="${s.img}"><span class="chip" style="position:absolute;left:16px;top:16px"><span class="dot"></span>${s.chip}</span></div><div><div class="label">${s.label}</div><h2 class="h2" style="font-size:calc(60px*var(--k))">${s.h}</h2><ul class="list mt">${s.items.map((t,j)=>`<li><span>/0${j+1}</span><b style="font-size:calc(26px*var(--k))">${t}</b></li>`).join('')}</ul><div class="card" style="margin-top:auto"><span class="k">${s.card.k}</span><span class="v ${s.card.blue?'blue':''}" style="${s.card.blue?'font-size:calc(64px*var(--k))':''}">${s.card.v}</span></div></div></div></section>`,
 section:(s,i)=>`<section class="slide"><div class="hd">${K}<span class="mi">${nn(i)}</span></div><div class="body"><div class="label">${s.label}</div><h2 class="h2">${s.h}</h2><div class="grow split mt"><div class="ph center" style="width:48%;flex:none"><img src="${s.img}" style="width:86%;max-height:92%;object-fit:contain"></div><div><ul class="list">${s.items.map((t,j)=>`<li><span>/0${j+1}</span><b style="font-size:calc(26px*var(--k))">${t}</b></li>`).join('')}</ul></div></div></div></section>`,
 specs:(s,i)=>`<section class="slide"><div class="hd">${K}<span class="mi">${nn(i)}</span></div><div class="body"><div class="label">${s.label}</div><h2 class="h2">${s.h}</h2><div class="grow cards mt" style="grid-template-rows:1.5fr ${'1fr '.repeat(Math.ceil(s.cards.length/2))}"><div class="card big span2"><span class="k">${s.big.k}</span><span class="v blue">${s.big.v}</span></div>${s.cards.map(([k,v])=>`<div class="card"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div></div></section>`,
 steps:(s,i)=>`<section class="slide"><div class="hd">${K}<span class="mi">${nn(i)}</span></div><div class="body"><div class="label">${s.label}</div><h2 class="h2">${s.h}</h2><ul class="list mt">${s.items.map(([b,p],j)=>`<li><span>/0${j+1}</span><div><b>${b}</b><p>${p}</p></div></li>`).join('')}</ul>${s.img?`<div class="grow ph mt"><img src="${s.img}"></div>`:''}${s.card?`<div class="card" style="margin-top:auto"><span class="k">${s.card.k}</span><span class="v blue" style="font-size:calc(64px*var(--k))">${s.card.v}</span></div>`:''}</div></section>`,
 systems:(s,i)=>`<section class="slide sandbg"><div class="hd">${K}<span class="mi">${nn(i)}</span></div><div class="body"><div class="label">${s.label}</div><h2 class="h2" style="font-size:calc(64px*var(--k))">${s.h}</h2><div class="grow split mt"><div style="flex:1;display:flex;flex-direction:column"><ul class="list" style="border-color:#cfc8bd">${s.items.map(([b,p],j)=>`<li style="border-color:#cfc8bd"><span>/0${j+1}</span><div><b>${b}</b><p>${p}</p></div></li>`).join('')}</ul></div><div class="center" style="width:46%;flex:none"><img src="${s.img}" style="mix-blend-mode:multiply;max-width:100%"></div></div></div></section>`,
 shipCover:(s,i)=>`<section class="slide panelbg"><div class="hd">${K}<span class="mi">Behind the scenes</span></div><div class="body"><h1 class="h1">${s.h}</h1><p class="lead">${s.d}</p><div class="grow center mt"><img src="${s.img}" style="max-width:100%;mix-blend-mode:multiply"></div><div class="strip rule"><span>5 steps</span>Swipe →</div></div></section>`,
 ship:(s,i)=>`<section class="slide panelbg"><div class="hd">${K}<span class="mi">Step /${s.n}</span></div><div class="body" style="margin-top:40px"><div class="grow center"><img src="${s.img}" style="max-width:100%;mix-blend-mode:multiply"></div><span class="chip" style="align-self:flex-start;margin-top:20px">${s.place}</span><h2 class="h2 mt2" style="font-size:calc(64px*var(--k))">${s.h}</h2><p class="lead" style="margin-top:14px">${s.d}</p><div style="display:flex;gap:8px;margin-top:28px">${[1,2,3,4,5].map(k=>`<span style="flex:1;height:4px;border-radius:2px;background:${k<=+s.n?'var(--char)':'var(--mist)'}"></span>`).join('')}</div></div></section>`,
 holiday:(s,i)=>`<section class="slide onphoto"><img class="bgimg" src="${s.img}"><div class="shade" style="background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.05) 30%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.75))"></div><div class="hd"><span class="mi">${s.label}</span>${W}</div><div class="body end"><h1 class="h1" style="font-size:calc(96px*var(--k))">${s.h}</h1><p class="lead">${s.d}</p></div></section>`,
 photoSlide:(s,i)=>`<section class="slide onphoto"><div class="bgimg" style="overflow:hidden;filter:none"><img src="${s.img}" style="width:100%;height:100%;object-fit:cover;filter:saturate(.74) contrast(1.04);transform:scale(${s.zoom||1});transform-origin:${s.origin||'50% 50%'}"></div><div class="shade" style="background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 70%,rgba(0,0,0,.5))"></div><div class="hd"><span class="mi">${nn(i)}</span>${W}</div><div class="body end"><span class="chip" style="align-self:flex-start"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>${s.chip}</span><p class="lead" style="font-size:calc(30px*var(--k));color:#fff;font-weight:500;max-width:700px">${s.cap}</p></div></section>`,
 details:(s,i)=>`<section class="slide light-btn"><div class="hd">${K}<span class="mi">${nn(i)}</span></div><div class="body"><div class="label">${s.label}</div><h2 class="h2">${s.h}</h2><div class="cards mt grow" style="grid-auto-rows:1fr;max-height:640px">${s.rows.map(([k,v,w])=>`<div class="card ${w?'span2':''}"><span class="k">${k}</span><span class="v">${ph(v)}</span></div>`).join('')}</div><div class="cta rule" style="margin-top:auto"><p>${s.q} ${s.rest}</p><span class="btn">${CLOSE_URL} ${arrow('#fff')}</span></div></div></section>`,
 close:(s,i)=>`<section class="slide dark ${s.img?'onphoto':''}">${s.img?`<img class="bgimg" src="${s.img}"><div class="shade" style="background:linear-gradient(180deg,rgba(20,20,22,.82),rgba(20,20,22,.6) 50%,rgba(20,20,22,.88))"></div>`:''}<div class="hd">${W}<span class="mi">${nn(i)}</span></div><div class="body"><div class="label">${s.label}</div><h2 class="h2">${s.h}</h2><p class="lead">${s.lead}</p><div class="cta rule" style="margin-top:auto"><p><b>${s.q}</b> ${s.rest}</p><span class="btn">${s.btn||CLOSE_URL} ${arrow('#222224')}</span></div></div></section>`,
 projCover:(s,i)=>`<section class="slide proj"><img class="ph" src="${s.img}" style="object-position:${s.pos||'50% 50%'}"><div class="fade"></div><div class="tile big"><img src="${P}valda-logo-ink.svg"></div><div class="name"><b>${s.h}</b><span>${s.d}</span></div></section>`,
 projPhoto:(s,i)=>`<section class="slide proj"><img class="ph" src="${s.img}" style="object-position:${s.pos||'50% 50%'}"><div class="tile sm"><img src="${P}valda-logo-ink.svg"></div></section>`,
};
document.body.innerHTML=post.slides.map((s,i)=>T[s.t](s,i)).join('');
</script></body></html>
