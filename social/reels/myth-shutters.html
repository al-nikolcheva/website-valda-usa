<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head><body>
<div class="hd"><img src="../../public/valda-logo-ink.svg" style="height:58px"><span>Myth vs fact /01</span></div>
<div id="stage"></div><div class="bar"><i id="prog"></i></div>
<script>
const D=12,$=id=>document.getElementById(id);
const e=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), f=(t,a,b)=>e((t-a)/(b-a));
const win=(x,y,glass,extra)=>`<rect x="${x}" y="${y}" width="300" height="420" rx="6" fill="none" stroke="#222224" stroke-width="10"/><rect x="${x+10}" y="${y+10}" width="280" height="400" fill="${glass}"/>${extra||''}`;
function render(t){
  let h='';
  if(t<2.6){const o=f(t,0.1,0.8);
    h=`<div class="a big" style="top:${330+(1-o)*30}px;font-size:100px;opacity:${o}">A storm forms fast.<br><span style="color:#a3a3a5">You are 300 miles away.</span></div>
       <svg class="a" style="top:900px;opacity:${o}" width="952" height="600">${[0,1,2,3,4,5].map(i=>`<path d="M${80+i*150},${120+((i*53)%60)} q60,-40 120,0" fill="none" stroke="#a3a3a5" stroke-width="8" stroke-linecap="round" transform="translate(${(t*120+i*40)%160-80},0)"/>`).join('')}
       <path d="M476,260 l-60,140 h50 l-30,120 l90,-160 h-55 l40,-100 z" fill="#1f4e8c" opacity="${0.6+0.4*Math.sin(t*12)}"/></svg>`;}
  else if(t<5.2){const lt=t-2.6,o=f(lt,0,0.5),s=f(lt,1.1,1.8);
    h=`<div class="a mid" style="top:330px;opacity:${o};color:#b4561f;font-weight:600;font-size:40px">Myth</div>
       <div class="a big" style="top:410px;font-size:118px;opacity:${o};text-decoration:line-through;text-decoration-thickness:10px;text-decoration-color:rgba(192,57,43,${s})">Hurricane shutters do the same job.</div>`;}
  else if(t<9.6){const lt=t-5.2,o=f(lt,0,0.5),sh=Math.min(1,lt/2.2),cr=f(lt,1.6,2.0);
    const shutter=[...Array(Math.round(sh*8))].map((_,i)=>`<rect x="70" y="${730+i*50}" width="280" height="44" fill="#a3a3a5"/>`).join('');
    const crack=`<g stroke="#ffffff" stroke-width="4" opacity="${cr}"><path d="M790,900 l-60,-70 M790,900 l70,-50 M790,900 l-40,90 M790,900 l90,40 M790,900 l10,-110"/></g>`;
    h=`<div class="a mid" style="top:330px;opacity:${o};color:#1f4e8c;font-weight:600;font-size:40px">Fact</div>
       <div class="a big" style="top:410px;font-size:76px;opacity:${o}">Shutters only work once someone closes them. Impact glass is always on.</div>
       <svg class="a" style="top:0;left:0;opacity:${o}" width="1080" height="1920">
         ${win(60,720,'#dce8f5',shutter)}${win(640,720,'#cfe0f2',crack)}
         <text x="210" y="1220" text-anchor="middle" font-size="30" fill="#6f6f72">Shutters</text>
         <text x="790" y="1220" text-anchor="middle" font-size="30" fill="#6f6f72">Impact glass</text>
         <text x="210" y="1275" text-anchor="middle" font-size="30" font-weight="600" fill="#b4561f">${sh<1?'Closing…':'Closed, if you were there'}</text>
         <text x="790" y="1275" text-anchor="middle" font-size="30" font-weight="600" fill="#1f4e8c" opacity="${cr}">Cracked, still sealed</text>
       </svg>`;}
  else{const lt=t-9.6,o=f(lt,0,0.5);
    h=`<div class="a big" style="top:360px;font-size:92px;opacity:${o}">And it works the other 364 days.</div>
       <div class="a" style="top:700px;opacity:${o}">${['Quieter rooms','UV protection','Harder to break in','Often lower wind insurance'].map((c,i)=>`<span class="chip" style="opacity:${f(lt,0.3+i*0.25,0.6+i*0.25)}">${c}</span>`).join('')}</div>
       <div class="a mid" style="top:1060px;opacity:${f(lt,1.2,1.7)};color:#222224;font-weight:600">Follow for Myth vs fact /02</div>
       <div class="a mid" style="top:1120px;opacity:${f(lt,1.2,1.7)};color:#1f4e8c">valdagroup.com</div>`;}
  $('stage').innerHTML=h; $('prog').style.width=(t/D*100)+'%';
}
window.render=render;window.DURATION=D;
</script></body></html>
