<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IT;font-weight:400;src:url(../../fonts/InterTight-400.ttf)}
@font-face{font-family:IT;font-weight:500;src:url(../../fonts/InterTight-500.ttf)}
@font-face{font-family:F;font-style:italic;src:url(../../fonts/fraunces-latin-400-italic.woff2)}
*{margin:0;box-sizing:border-box}html,body{background:transparent}
.s{position:relative;width:1080px;height:1920px;overflow:hidden;color:#f4efe7;font-family:IT}
.g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,12,10,.55) 0%,rgba(14,12,10,0) 18%,rgba(14,12,10,0) 52%,rgba(14,12,10,.82) 100%)}
.top{position:absolute;left:72px;right:72px;top:96px;display:flex;justify-content:space-between;font:500 30px IT;letter-spacing:.16em;text-transform:uppercase}
.txt{position:absolute;left:72px;right:72px;bottom:330px}
.k{font:500 30px IT;letter-spacing:.16em;text-transform:uppercase;opacity:.85;margin-bottom:26px}
.h{font:400 96px/1.02 IT;letter-spacing:-.035em}
.end{position:absolute;inset:0;background:#0c0c0d;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:56px;text-align:center}
.end img{width:420px}.end .h{font-size:84px;max-width:860px}.end .h em{font-family:F}.end .k{opacity:.6}
</style></head><body><div id="root"></div><script>
const s=JSON.parse(decodeURIComponent(location.hash.slice(1)));
document.getElementById('root').innerHTML = s.media==='end'
 ? `<section class="s"><div class="end"><img src="../../../public/images/wordmark-white.png"><div class="h">European windows, <em>made to measure.</em></div><div class="k">valdagroup.com</div></div></section>`
 : `<section class="s"><div class="g"></div><div class="top"><span>VALDA</span><span>${s.i}/4</span></div><div class="txt"><div class="k">${s.kicker}</div><div class="h">${s.head}</div></div></section>`;
</script></body></html>
