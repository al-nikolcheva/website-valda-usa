<title>VALDA Content Calendar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a wall-planner month grid, Mon–Sun, one column per weekday; a detail sheet slides over it. */
:root{
  --bg:#f3f3f1; --card:#ffffff; --ink:#1d1e21; --mute:#6c6e74; --line:#dcdcd8; --blue:#1f4e8c; --blue-soft:#e3ebf6;
  --edu:#1f4e8c; --prod:#2f6f62; --proj:#8a5a2b; --blog:#6b3fa0; --reel:#b23a48; --co:#4b5563; --hol:#9a8a2f;
  --ok:#2e7d4f; --wait:#b7791f; --done:#8b8f96;
  --display:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141518; --card:#1d1f23; --ink:#ecedef; --mute:#9a9ea6; --line:#2e3137; --blue:#7fa8de; --blue-soft:#1d2a3c;
  --edu:#7fa8de; --prod:#6fbfae; --proj:#d6a66f; --blog:#b896e6; --reel:#e58592; --co:#a4abb6; --hol:#d2c271;
  --ok:#6cc792; --wait:#e2b25a; --done:#7c818a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141518; --card:#1d1f23; --ink:#ecedef; --mute:#9a9ea6; --line:#2e3137; --blue:#7fa8de; --blue-soft:#1d2a3c;
  --edu:#7fa8de; --prod:#6fbfae; --proj:#d6a66f; --blog:#b896e6; --reel:#e58592; --co:#a4abb6; --hol:#d2c271;
  --ok:#6cc792; --wait:#e2b25a; --done:#7c818a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--display)}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:18px}
h1{font:600 30px/1.1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--mute);margin-top:4px}
.tabs{display:flex;gap:6px}
.tabs button{font:500 14px var(--display);padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button:focus-visible,.cell:focus-visible,.post:focus-visible,.close:focus-visible,.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 14px;color:var(--mute);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.stat{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.stat b{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--card)}
.dow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{min-height:150px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.cell.out{background:var(--bg)}
.cell.out .num{opacity:.35}
.cell.today .num{background:var(--ink);color:var(--bg);border-radius:6px;padding:0 6px}
.num{font:500 12px var(--mono);align-self:flex-start;font-variant-numeric:tabular-nums}
.post{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;border-radius:8px;padding:5px;margin:-2px;min-width:0}
.post:hover{background:var(--blue-soft)}
.thumb{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:var(--bg);max-width:100%}
.post.reel .thumb{aspect-ratio:4/5;object-position:center 30%}
.ptitle{font:600 12.5px/1.25 var(--display);overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);min-width:0}
.pill{font:500 10.5px var(--display);padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.st-concept{color:var(--blog)} .st-posted{color:var(--done)} .st-scheduled{color:var(--ok)} .st-approve{color:var(--wait)}
.blog{font-size:11.5px;padding:6px 7px;border-radius:6px;background:var(--blue-soft);color:var(--ink);display:flex;flex-direction:column;gap:2px}
.blog b{font-weight:600;color:var(--blog)}
.empty{font-size:11px;color:var(--mute);font-style:italic}
/* full-screen post viewer: the slide as large as the screen allows, details beside it (below on phones) */
.sheet{position:fixed;inset:0;z-index:10;background:#0e0e10;color:#f2f2f2;overflow:auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lb{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;min-height:100%;max-width:1500px;margin:0 auto}
.lb-media{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.stage{position:relative;display:flex;justify-content:center;align-items:center;width:100%;height:calc(100vh - 150px);min-height:320px;touch-action:pan-y}
.stage img,.stage video{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:4px;box-shadow:0 10px 40px rgb(0 0 0 / .5);display:block}
.nav{all:unset;position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:999px;background:rgb(255 255 255 / .92);color:#111;display:grid;place-items:center;font:600 24px var(--display);cursor:pointer;box-shadow:0 2px 10px rgb(0 0 0 / .3)}
.nav.prev{left:8px}.nav.next{right:8px}.nav[disabled]{opacity:.25;cursor:default}
.nav:focus-visible,.thumbs button:focus-visible,.close:focus-visible,.seg button:focus-visible{outline:2px solid #7fa8de;outline-offset:2px}
.count{font:500 13px var(--mono);color:#bbb}
.thumbs{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px}
.thumbs button{all:unset;cursor:pointer;flex:none;border-radius:4px;outline:2px solid transparent;opacity:.55}
.thumbs button.on{outline-color:#fff;opacity:1}
.thumbs img{height:76px;width:auto;display:block;border-radius:4px}
.lb-info{background:#1c1c1f;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;align-self:start;min-width:0}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:start}
.ph h2{font:600 22px/1.2 var(--display);margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance;color:#fff}
.lb-info .meta{color:#aaa}
.close{all:unset;cursor:pointer;font:500 13px var(--display);padding:8px 14px;border:1px solid #444;border-radius:999px;flex:none;color:#fff}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.time{border:1px solid #333;border-radius:8px;padding:8px 10px}
.time small{display:block;color:#999;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.time b{font:600 14px var(--display);font-variant-numeric:tabular-nums;color:#fff}
.seg{display:flex;gap:6px}
.seg button{font:500 13px var(--display);padding:6px 12px;border-radius:999px;border:1px solid #444;background:none;color:#ddd;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;border-color:#fff;color:#111}
pre.cap{white-space:pre-wrap;font:400 14.5px/1.55 var(--display);margin:0;min-width:0;color:#e8e8e8}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:12px;padding:3px 9px;border-radius:999px;background:#2a2a2e;border:1px solid #3a3a3e;color:#ddd;overflow-wrap:anywhere}
@media (max-width:1000px){
  .lb{grid-template-columns:minmax(0,1fr)}
  .stage{height:auto;min-height:0}
  .stage img,.stage video{max-height:78vh}
}
@media (max-width:760px){
  .grid{display:block;border:none;background:none}
  .dow{display:none}
  .cell{min-height:0;border:none;border-bottom:1px solid var(--line);flex-direction:row;align-items:flex-start;gap:12px;padding:10px 0;background:none}
  .cell.out,.cell.blank{display:none}
  .num{width:58px;flex:none}
  .cell .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .post{flex-direction:row;align-items:center;gap:10px}
  .post .thumb{width:64px;flex:none}
}
@media (min-width:761px){.cell .body{display:contents}}
@media (prefers-reduced-motion:no-preference){.lb{animation:fadein .15s ease-out}@keyframes fadein{from{opacity:.4}}}
</style>

<div class="wrap">
  <header>
    <div><h1>VALDA Content Calendar</h1><div class="sub" id="sub"></div></div>
    <div class="tabs" role="group" aria-label="Month"><button id="m10" aria-pressed="true">October</button><button id="m11" aria-pressed="false">November</button></div>
  </header>
  <div class="legend" id="legend"></div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="sheet" id="sheet" hidden></div>

<script>
const DATA = __DATA__;
const PILLAR = {'Educational':['Educational','--edu'],'What we have':['Product','--prod'],'Projects':['Project','--proj'],'Blog':['Blog post','--blog'],
  'Reel':['Reel','--reel'],'News':['Company','--co'],'Behind the scenes':['Behind the scenes','--co'],'Holiday':['Holiday','--hol'],'POV series':['POV series','--reel'],'Behind the Build':['Behind the Build','--proj'],'One number':['One number','--edu'],'This or that':['This or that','--prod']};
const STATUS = {'posted':['Posted','st-posted'],'scheduled':['Scheduled','st-scheduled'],'to approve':['To approve','st-approve'],'ready':['Built · to approve','st-approve'],'concept':['Idea · to approve','st-concept']};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byDate = {}; DATA.posts.forEach(p => (byDate[p.date] ??= []).push(p));
const blogBy = {}; DATA.blogs.forEach(b => (blogBy[b.date] ??= []).push(b));
const fmt = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});

$('sub').textContent = `October–November 2026 · LinkedIn and Instagram · times in US Eastern · updated ${new Date(DATA.updated+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
$('legend').innerHTML = [...new Set(Object.values(PILLAR).map(v=>v.join('|')))].map(v => { const [n,c]=v.split('|'); return `<span><i class="dot" style="background:var(${c})"></i>${n}</span>`; }).join('') +
  `<span><i class="dot" style="background:var(--blog);opacity:.35"></i>Blog article (website)</span>`;

let month = '10';
try { const m = localStorage.getItem('cal-month'); if (m === '10' || m === '11') month = m; } catch {}

function render() {
  $('m10').setAttribute('aria-pressed', month === '10'); $('m11').setAttribute('aria-pressed', month === '11');
  const inMonth = DATA.posts.filter(p => p.date.slice(5,7) === month);
  const c = s => inMonth.filter(p => p.status === s).length;
  $('stats').innerHTML = `<span class="stat"><b>${inMonth.length}</b> posts</span><span class="stat st-posted"><b>${c('posted')}</b> posted</span><span class="stat st-scheduled"><b>${c('scheduled')}</b> scheduled</span><span class="stat st-approve"><b>${c('to approve')+c('ready')}</b> built, to approve</span><span class="stat st-concept"><b>${c('concept')}</b> ideas</span>`;
  const y = 2026, m = +month - 1, first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7, total = Math.ceil((lead + days) / 7) * 7;
  let html = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < total; i++) {
    const dt = new Date(y, m, i - lead + 1), out = dt.getMonth() !== m;
    const iso = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    const ps = out ? [] : (byDate[iso] || []), b = out ? null : blogBy[iso];
    const label = window.matchMedia('(max-width:760px)').matches ? dt.toLocaleDateString('en-US',{weekday:'short',day:'numeric'}) : dt.getDate();
    const body = ps.map(p => { const [pn, pc] = PILLAR[p.pillar] || [p.pillar,'--co'], [sn, sc] = STATUS[p.status];
      return `<button class="post${p.video?' reel':''}" data-date="${iso}" data-title="${esc(p.title)}" aria-label="${esc(p.title)}, ${pn}, ${sn}">
        <img class="thumb" src="${p.slides[0]}" alt="">
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="meta"><i class="dot" style="background:var(${pc})"></i>${pn}${p.video?` · ${p.video}s`:''}</span>
        <span class="ptitle">${esc(p.title)}</span><span class="meta"><span class="pill ${sc}">${sn}</span></span></span></button>`; }).join('') +
      (b ? b.map(x => `<div class="blog"><b>Blog article</b>${esc(x.title)}<span style="color:var(--mute)">${esc(x.status)}</span></div>`).join('') : '');
    const blank = !out && !ps.length && !b;
    html += `<div class="cell${out?' out':''}${blank?' blank':''}${iso===DATA.updated?' today':''}"><span class="num">${label}</span><div class="body">${body}</div></div>`;
  }
  $('grid').innerHTML = html;
}

function open(date, title) {
  const p = (byDate[date] || []).find(x => x.title === title); if (!p) return;
  const [pn, pc] = PILLAR[p.pillar] || [p.pillar,'--co'], [sn, sc] = STATUS[p.status];
  let net = 'ig', idx = 0;
  const draw = () => {
    const multi = !p.videoSrc && p.slides.length > 1;
    $('sheet').innerHTML = `<div class="lb" role="dialog" aria-modal="true" aria-label="${esc(p.title)}">
      <div class="lb-media">
        <div class="stage" id="stage">${p.videoSrc?`<video src="${p.videoSrc}" controls playsinline preload="metadata" poster="${p.slides[0]}"></video>`:`<img id="slide" src="${p.slides[idx]}" alt="Slide ${idx+1} of ${p.slides.length}, ${esc(p.title)}">${multi?`<button class="nav prev" id="prev" aria-label="Previous slide" ${idx===0?'disabled':''}>‹</button><button class="nav next" id="next" aria-label="Next slide" ${idx===p.slides.length-1?'disabled':''}>›</button>`:''}`}</div>
        ${multi?`<div class="count">Slide ${idx+1} of ${p.slides.length}</div><div class="thumbs">${p.slides.map((t,i)=>`<button data-i="${i}" class="${i===idx?'on':''}" aria-label="Go to slide ${i+1}"><img src="${t}" alt=""></button>`).join('')}</div>`:''}
      </div>
      <div class="lb-info">
        <div class="ph"><div><div class="meta"><i class="dot" style="background:var(${pc})"></i>${pn} · ${fmt(p.date)} <span class="pill ${sc}">${sn}</span></div><h2>${esc(p.title)}</h2></div>
          <button class="close" id="close">Close</button></div>
        <div class="times"><div class="time"><small>LinkedIn</small><b>${esc(p.li.time || '—')}</b></div><div class="time"><small>Instagram</small><b>${esc(p.ig.time || '—')}</b></div><div class="time"><small>Story</small><b>6:00 PM ET</b></div></div>
        <div class="facts">${p.video?`<span class="fact">Reel · ${p.video} s · 9:16</span>`:`<span class="fact">${p.slides.length} slide${p.slides.length>1?'s':''}</span>`}${p.tags.map(t=>`<span class="fact">Tag: ${esc(t)}</span>`).join('')}${p.link?`<span class="fact">Link: ${esc(p.link)}</span>`:''}</div>
        <div class="seg" role="group" aria-label="Caption"><button id="bi" aria-pressed="${net==='ig'}">Instagram caption</button><button id="bl" aria-pressed="${net==='li'}">LinkedIn caption</button></div>
        <pre class="cap">${esc(p[net].caption)}</pre>
      </div></div>`;
    document.querySelectorAll('.thumbs button').forEach(b => b.onclick = () => { idx = +b.dataset.i; draw(); });
    $('close').onclick = closeSheet;
    const go = d => { const n = idx + d; if (n < 0 || n >= p.slides.length) return; idx = n; draw(); };
    if ($('prev')) { $('prev').onclick = () => go(-1); $('next').onclick = () => go(1); }
    let x0 = null; const st = $('stage');
    st.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    st.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); x0 = null; });
    sheetKeys = go; $('bi').onclick = () => { net='ig'; draw(); }; $('bl').onclick = () => { net='li'; draw(); };
    $('close').focus();
  };
  $('sheet').hidden = false; document.body.style.overflow = 'hidden'; draw();
}
function closeSheet(){ $('sheet').hidden = true; $('sheet').innerHTML = ''; document.body.style.overflow = ''; }
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet' || e.target.classList.contains('stage')) closeSheet(); });
let sheetKeys = null;
document.addEventListener('keydown', e => { if ($('sheet').hidden) return; if (e.key === 'Escape') closeSheet(); if (sheetKeys && e.key === 'ArrowRight') sheetKeys(1); if (sheetKeys && e.key === 'ArrowLeft') sheetKeys(-1); });
$('grid').addEventListener('click', e => { const b = e.target.closest('.post'); if (b) open(b.dataset.date, b.dataset.title); });
for (const m of ['10','11']) $('m'+m).onclick = () => { month = m; try { localStorage.setItem('cal-month', m); } catch {} render(); };
window.matchMedia('(max-width:760px)').addEventListener('change', render);
render();
</script>
