<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Calendar covers</title>
<link rel="stylesheet" href="../site.css">
<style>
.slide{height:1350px}
.bh{font-weight:600;letter-spacing:-.035em;line-height:.98}
/* Projects: full-bleed photo */
.proj .bleed{filter:saturate(.75) contrast(1.04)}
.proj .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 72%,rgba(0,0,0,.45))}
.proj .lab{position:absolute;left:var(--m);bottom:56px;color:#fff;font-size:26px;line-height:1.35}
.proj .lab b{display:block;font-weight:600;font-size:34px;letter-spacing:-.01em}
.proj .lab span{color:rgba(255,255,255,.8)}
/* What we have: sand, product cutaway, spec strip */
.prod{background:#e9e4dc}
.prod .t1{position:absolute;left:var(--m);right:var(--m);top:190px;font-size:116px;color:var(--char)}
.prod .d1{position:absolute;left:var(--m);top:470px;width:420px;font-size:24px;line-height:1.45;color:#6b665e}
.prod .cut{position:absolute;right:60px;bottom:180px;height:600px;max-width:600px;object-fit:contain}
.prod .strip{position:absolute;left:var(--m);right:var(--m);bottom:56px;border-top:1px solid #cfc8bd;padding-top:20px;display:flex;justify-content:space-between;font-size:22px;font-weight:500}
.prod .strip span{color:#8a847b;font-weight:400}
.prod .micro{color:#8a847b}
/* Educational: charcoal, question, framed photo */
.edu .t1{position:absolute;left:var(--m);right:var(--m);top:190px;font-size:116px;color:#fff}
.edu .d1{position:absolute;left:var(--m);top:470px;width:470px;font-size:24px;line-height:1.45;color:#a9a9ad}
.edu .num{position:absolute;right:var(--m);top:470px;font-size:24px;color:#8fb0e6}
.edu .ph{position:absolute;left:var(--m);right:var(--m);top:640px;bottom:56px;border-radius:12px;overflow:hidden}
.edu .ph img{width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(1.04)}

/* v2 variety */
.sym{height:46px;display:block}
.mi{font-size:20px;color:#a9a9ad}
.photoType .bleed{filter:saturate(.7) contrast(1.05) brightness(.82)}
.photoType .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.7))}
.photoType h1{position:absolute;left:var(--m);right:var(--m);bottom:120px;font-size:120px;color:#fff}
.photoType .meta{position:absolute;left:var(--m);right:var(--m);bottom:56px;display:flex;justify-content:space-between;font-size:22px;color:rgba(255,255,255,.8);border-top:1px solid rgba(255,255,255,.3);padding-top:16px}
.card{background:#fff}
.card .ph{position:absolute;left:var(--m);right:var(--m);top:150px;height:820px;border-radius:12px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;filter:saturate(.75) contrast(1.04)}
.card h1{position:absolute;left:var(--m);top:1020px;font-size:72px}
.card .meta{position:absolute;left:var(--m);right:var(--m);bottom:56px;display:grid;grid-template-columns:repeat(3,1fr);font-size:22px;font-weight:500;border-top:1px solid var(--mist);padding-top:16px}
.card .meta span{display:block;color:var(--mute);font-weight:400;font-size:17px}
.darkCut .stage{position:absolute;left:var(--m);right:var(--m);top:420px;bottom:200px;display:flex;align-items:center;justify-content:center}
.darkCut .stage img{max-height:100%;max-width:90%;height:auto;width:auto;object-fit:contain}
.darkCut .stage.box{background:#fff;border-radius:12px}
.darkCut .stage.box img{mix-blend-mode:multiply;max-height:88%}
.darkCut h1{position:absolute;left:var(--m);right:var(--m);top:180px;font-size:92px;color:#fff}
.darkCut .strip{position:absolute;left:var(--m);right:var(--m);bottom:56px;border-top:1px solid rgba(255,255,255,.18);padding-top:20px;display:flex;justify-content:space-between;font-size:22px;color:#fff}
.darkCut .strip span{color:#8a8a8d}
.inSitu .bleed{filter:saturate(.75) contrast(1.04)}
.inSitu .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,0) 25%)}
.inSitu .tag{position:absolute;left:var(--m);bottom:56px;background:rgba(255,255,255,.92);border-radius:12px;padding:22px 26px;width:470px}
.inSitu .tag b{display:block;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.inSitu .tag span{display:block;font-size:18px;color:var(--slate);margin-top:10px}
.stat{background:#f4f4f4}
.stat .n{position:absolute;left:var(--m);right:var(--m);top:300px;font-size:330px;font-weight:500;letter-spacing:-.06em;line-height:.85;color:var(--blue)}
.stat .n small{font-size:110px;letter-spacing:-.03em}
.stat h1{position:absolute;left:var(--m);right:var(--m);top:720px;font-size:84px}
.stat .d1{position:absolute;left:var(--m);width:560px;top:930px;font-size:24px;line-height:1.45;color:var(--slate)}
.stat .foot{position:absolute;left:var(--m);right:var(--m);bottom:56px;border-top:1px solid var(--mist);padding-top:18px;display:flex;justify-content:space-between;font-size:19px;color:var(--mute)}
.over .bleed{filter:saturate(.7) contrast(1.05)}
.over .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.1) 35%,rgba(0,0,0,.2) 55%,rgba(0,0,0,.78))}
.over h1{position:absolute;left:var(--m);right:var(--m);bottom:190px;font-size:116px;color:#fff}
.over .d1{position:absolute;left:var(--m);width:600px;bottom:70px;font-size:24px;line-height:1.45;color:rgba(255,255,255,.85)}
.drawing{background:#fff}
.drawing h1{position:absolute;left:var(--m);right:var(--m);top:180px;font-size:96px}
.drawing .dr{position:absolute;left:340px;right:60px;top:430px;bottom:150px;display:grid;place-items:center}
.drawing .dr img{max-width:100%;max-height:100%}
.drawing .foot{position:absolute;left:var(--m);right:var(--m);bottom:56px;border-top:1px solid var(--mist);padding-top:18px;display:flex;justify-content:space-between;font-size:19px;color:var(--mute)}
.drawing .lbl{position:absolute;left:var(--m);top:470px;width:240px;font-size:22px;line-height:1.45;color:var(--slate)}
</style></head><body>
<script>
const P='../../public/';
const W=(w)=>`<img class="sym" src="${P}valda-logo-white.svg">`, K=()=>`<img class="sym" src="${P}valda-logo-ink.svg">`;
const T={
 photo:(o)=>`<section class="slide proj"><img class="bleed" src="${o.img}"><div class="shade"></div><div class="top"><span></span>${W()}</div><div class="lab"><b>${o.h}</b><span>${o.d}</span></div></section>`,
 photoType:(o)=>`<section class="slide photoType"><img class="bleed" src="${o.img}" style="object-position:${o.pos||'50% 50%'}"><div class="shade"></div><div class="top"><span class="mi" style="color:rgba(255,255,255,.8)">Project</span>${W()}</div><h1 class="bh">${o.h}</h1><div class="meta"><span>${o.d}</span><span>${o.c}</span></div></section>`,
 card:(o)=>`<section class="slide card"><div class="top"><span class="mi" style="color:var(--mute)">Project</span>${K()}</div><div class="ph"><img src="${o.img}"></div><h1 class="bh">${o.h}</h1><div class="meta">${o.meta.map(([k,v])=>`<div><span>${k}</span>${v}</div>`).join('')}</div></section>`,
 sand:(o)=>`<section class="slide prod"><div class="top"><span class="micro">What we have</span>${K()}</div><h1 class="bh t1">${o.h}</h1><p class="d1">${o.d}</p><img class="cut" src="${o.img}"><div class="strip"><span>System</span>${o.c}</div></section>`,
 darkCut:(o)=>`<section class="slide char darkCut"><div class="top"><span class="mi">What we have</span>${W()}</div><h1 class="bh">${o.h}</h1><div class="stage ${o.box?'box':''}"><img src="${o.img}"></div><div class="strip"><span>System</span>${o.c}</div></section>`,
 inSitu:(o)=>`<section class="slide inSitu"><img class="bleed" src="${o.img}" style="object-position:${o.pos||'50% 50%'}"><div class="shade"></div><div class="top"><span class="mi" style="color:rgba(255,255,255,.85)">What we have</span>${W()}</div><div class="tag"><b>${o.h}</b><span>${o.c}</span></div></section>`,
 charQ:(o)=>`<section class="slide char edu"><div class="top">${W()}<span class="micro">${o.c}</span></div><h1 class="bh t1">${o.h}</h1><p class="d1">${o.d}</p><span class="num">Swipe →</span><div class="ph"><img src="${o.img}"></div></section>`,
 stat:(o)=>`<section class="slide stat"><div class="top">${K()}<span class="mi" style="color:var(--mute)">${o.c}</span></div><div class="n">${o.n}</div><h1 class="bh">${o.h}</h1><p class="d1">${o.d}</p><div class="foot"><span>${o.f}</span><span>Swipe →</span></div></section>`,
 over:(o)=>`<section class="slide light over"><img class="bleed" src="${o.img}" style="object-position:${o.pos||'50% 50%'}"><div class="shade"></div><div class="top">${W()}<span class="mi" style="color:rgba(255,255,255,.85)">${o.c}</span></div><h1 class="bh">${o.h}</h1><p class="d1">${o.d}</p></section>`,
 drawing:(o)=>`<section class="slide drawing"><div class="top">${K()}<span class="mi" style="color:var(--mute)">${o.c}</span></div><h1 class="bh">${o.h}</h1><p class="lbl">${o.d}</p><div class="dr"><img src="${o.img}"></div><div class="foot"><span>${o.f}</span><span>Swipe →</span></div></section>`,
};
// chronological: W1 Tue, Thu, Fri ... W8
const D=[
 ['charQ',{h:'Aluminium or PVC?',d:'How to choose your window frame. A 60 second guide.',c:'Guide /01',img:P+'images/hero-glass.png'}],
 ['sand',{h:'Built to disappear.',d:'VALDA Vista Guard. Slim aluminium, rated for the hurricane coast.',c:'Vista Guard · VALDA',img:'../assets/vista-cut.png'}],
 ['photo',{h:'GORA, Sofia',d:'Residential · 2023',img:P+'images/proj-gora.jpg'}],
 ['stat',{n:'0.14',h:'What U-factor really tells you.',d:'How much heat a window lets through. Lower is better. This is our best triple-glazed figure.',c:'Guide /02',f:'U-factor · MasterLine 10, triple glazed'}],
 ['darkCut',{h:'One window, two ways to open.',c:'Tilt and turn · MasterLine 8 · Reynaers',img:P+'products/masterline-8.png'}],
 ['photoType',{h:'American University of Malta',d:'Cospicua, Malta',c:'Institutional · 2022',img:P+'images/proj-aum.jpg'}],
 ['drawing',{h:'More glass, less frame.',d:'Sightlines: the visible frame around the glass. A few millimetres change a room.',c:'Guide /03',f:'Sightlines',img:'../assets/iso-window.png'}],
 ['inSitu',{h:'Open-plan, opened up.',c:'Sliding and folding · ConceptFolding 77 · Reynaers',img:P+'images/product-sliding.png',pos:'50% 50%'}],
 ['card',{h:'Austin Residence',img:P+'images/proj-austin.jpg',meta:[['City','Austin, USA'],['Type','Luxury residential'],['Year','2024']]}],
 ['charQ',{h:'Fixed or operable?',d:'Plan your glazing early and the rest follows.',c:'Guide /04',img:P+'images/facade-stone.png'}],
 ['sand',{h:'Warm, efficient, low upkeep.',d:'The PVC range, for thermal performance on every budget.',c:'Series 76 MD · Kömmerling',img:'../assets/cut-76md-section.png'}],
 ['photo',{h:'Mona Residence, Sofia',d:'Multifamily · 2024',img:P+'images/project-mona-1.jpg'}],
 ['over',{h:'The thermal break, explained.',d:'What sits inside an aluminium frame, and why it keeps the room warm.',c:'Guide /05',img:P+'images/arch-5.jpg'}],
 ['darkCut',{h:'Glazing at building scale.',c:'Facade systems · ConceptWall 50 · Reynaers',img:'../assets/cut-conceptwall-50.png'}],
 ['photoType',{h:'Amaya Residence',d:'Sofia, Bulgaria',c:'Residential · 2023',img:P+'images/proj-amaya.jpg'}],
 ['stat',{n:'50<small> STC</small>',h:'What STC means for comfort.',d:'The rating behind a quiet room on a busy street. Higher is quieter.',c:'Guide /06',f:'STC · MasterLine 10'}],
 ['inSitu',{h:'Dual-action, explained.',c:'Tilt and turn · Series 88 · Kömmerling',img:P+'images/product-windows.png',pos:'50% 40%'}],
 ['card',{h:'Juneau Village',img:P+'images/project-milwaukee-1.jpg',meta:[['City','Milwaukee, USA'],['Type','Multifamily'],['Year','2025']]}],
 ['charQ',{h:'Triple glazing: worth it?',d:'When the third pane pays back, and when it does not.',c:'Guide /07',img:P+'images/home-modern-pool.webp'}],
 ['sand',{h:'The classic, engineered.',d:'Casement systems with modern thermal performance.',c:'ConceptSystem 77 · Reynaers',img:P+'products/conceptsystem-77.png'}],
 ['photo',{h:'Stella, Sofia',d:'Residential · 2023',img:P+'images/proj-stella.jpg'}],
 ['over',{h:'How to read a spec sheet.',d:'The five figures worth checking before you sign off a window.',c:'Guide /08',img:P+'images/consultation.webp'}],
 ['darkCut',{h:'From double to triple.',c:'Glazing options · Vista Guard · VALDA',img:'../assets/vista-cut.png'}],
 ['photoType',{h:'Belle Epoque',d:'Sofia, Bulgaria',c:'Residential · 2022',img:P+'images/proj-belle.jpg'}],
];
document.body.innerHTML=D.map(([t,o])=>T[t](o)).join('');
</script>
</body></html>
